<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cartoon avatar of Noushad Ali">
  <defs>
    <!-- black / grey / white plaid for the shirt -->
    <pattern id="plaid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#8a9099"/>
      <rect y="5" width="16" height="6" fill="#2b2f36" opacity="0.85"/>
      <rect x="5" width="6" height="16" fill="#2b2f36" opacity="0.7"/>
      <rect y="2" width="16" height="1" fill="#f1f3f5"/>
      <rect y="13" width="16" height="1" fill="#f1f3f5"/>
      <rect x="2" width="1" height="16" fill="#f1f3f5"/>
      <rect x="13" width="1" height="16" fill="#f1f3f5"/>
    </pattern>
  </defs>

  <!-- shirt / shoulders -->
  <path d="M30 200 C30 170 52 152 84 147 L116 147 C148 152 170 170 170 200 Z" fill="url(#plaid)"/>

  <!-- neck -->
  <path d="M87 128 L113 128 L113 150 L100 168 L87 150 Z" fill="#c98f68"/>

  <!-- open collar -->
  <path d="M84 146 L100 168 L92 176 L76 152 Z" fill="url(#plaid)" stroke="#2b2f36" stroke-width="1.2"/>
  <path d="M116 146 L100 168 L108 176 L124 152 Z" fill="url(#plaid)" stroke="#2b2f36" stroke-width="1.2"/>

  <!-- crossed arms -->
  <path d="M44 200 C48 186 66 179 100 179 C134 179 152 186 156 200 Z" fill="url(#plaid)" stroke="#2b2f36" stroke-width="1.2"/>
  <path d="M60 189 C80 184 120 184 140 189" stroke="#2b2f36" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- ears -->
  <ellipse cx="68" cy="99" rx="6" ry="10" fill="#c98f68"/>
  <ellipse cx="132" cy="99" rx="6" ry="10" fill="#c98f68"/>

  <!-- face (slim, slightly pointed chin) -->
  <path d="M69 88 C69 63 82 52 100 52 C118 52 131 63 131 88 L131 104 C131 122 118 140 100 141 C82 140 69 122 69 104 Z" fill="#dba47c"/>

  <!-- hair: swept up and back with volume, short sides, visible forehead -->
  <path d="M69 94 C66 80 66 66 72 56 C76 44 86 34 100 31 C114 28 128 32 135 42
           C140 50 139 62 135 70 C133 78 132 86 131 94 C129 84 128 76 126 70
           C118 63 108 60 98 60 C88 60 80 63 74 70 C72 78 70 86 69 94 Z" fill="#141110"/>
  <!-- hair strands -->
  <path d="M80 60 C86 46 100 38 118 37" stroke="#3a322c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M92 58 C98 48 110 43 126 44" stroke="#3a322c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M106 58 C112 52 120 50 130 52" stroke="#3a322c" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- light beard along the jawline + chin goatee -->
  <path d="M70 98 L70 106 C70 124 84 140 100 141 C116 140 130 124 130 106 L130 98
           C127 116 116 130 106 134 L94 134 C84 130 73 116 70 98 Z" fill="#1c1714" opacity="0.55"/>
  <path d="M94 126 C97 124 103 124 106 126 L107 135 C104 140 96 140 93 135 Z" fill="#1c1714" opacity="0.75"/>

  <!-- eyebrows (thick, straight) -->
  <path d="M78 81 Q86 76 95 80" stroke="#141110" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M105 80 Q114 76 122 81" stroke="#141110" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M80 91 Q87 86 94 91 Q87 95 80 91 Z" fill="#fff"/>
  <path d="M106 91 Q113 86 120 91 Q113 95 106 91 Z" fill="#fff"/>
  <circle cx="87" cy="90.5" r="3.2" fill="#2a1a12"/>
  <circle cx="113" cy="90.5" r="3.2" fill="#2a1a12"/>
  <circle cx="88" cy="89.5" r="0.9" fill="#fff"/>
  <circle cx="114" cy="89.5" r="0.9" fill="#fff"/>

  <!-- nose -->
  <path d="M100 92 L97 106 Q100 108 104 106" stroke="#9c6040" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- thin mustache -->
  <path d="M88 113 C93 110 98 110 100 111 C102 110 107 110 112 113 C107 113.5 104 114 100 113.5 C96 114 93 113.5 88 113 Z" fill="#1c1714" opacity="0.6"/>

  <!-- calm, slight smile -->
  <path d="M93 118 Q100 120.5 107 118" stroke="#7a3f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
</svg>
